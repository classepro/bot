<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professeur ClassePro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Calibri", "Times New Roman", serif;
    }

    body {
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      padding-bottom: 80px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      background: #3D3B8E;
      color: white;
      align-self: flex-end;
    }

    .message.bot {
      background: #f1f1f1;
      color: #222;
      align-self: flex-start;
      border-left: 4px solid #FF7E5F;
    }

    .chat-input-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
      z-index: 100;
    }

    .chat-input-wrapper {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 8px 16px;
      max-height: 150px;
      overflow-y: auto;
      border: 2px solid transparent;
    }

    .chat-input:focus-within {
      border-color: #6883BA;
    }

    .chat-input textarea {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
      resize: none;
      padding: 4px 0;
      max-height: 120px;
      line-height: 1.5;
    }

    .chat-input textarea::placeholder {
      color: #888;
    }

    .chat-input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .chat-input button {
      border: none;
      background: linear-gradient(135deg, #3D3B8E, #FF7E5F);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .chat-input button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(61, 59, 142, 0.3);
    }

    .file-preview {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .file-preview img {
      max-width: 150px;
      border-radius: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      margin-top: 5px;
    }

    .file-item .file-icon {
      font-size: 18px;
    }

    .file-item .file-name {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .file-size {
      font-size: 12px;
      opacity: 0.7;
    }

    audio {
      width: 200px;
    }

    embed {
      width: 200px;
      height: 150px;
    }

    /* Modal pour la prévisualisation des fichiers */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      border-radius: 10px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
      position: relative;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      z-index: 1001;
      background: rgba(61, 59, 142, 0.8);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Style pour les fichiers non-visuels */
    .file-preview-container {
      max-width: 250px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* Style pour le texte de l'IA */
    .bot-message-content {
      white-space: pre-line;
      line-height: 1.6;
    }

    .bot-message-content p {
      margin-bottom: 12px;
    }

    .bot-message-content p:last-child {
      margin-bottom: 0;
    }

    .bot-message-content strong {
      font-weight: bold;
      color: #3D3B8E;
    }

    /* Indicateur de frappe */
    .typing-indicator {
      display: inline-block;
      margin-left: 5px;
    }

    .typing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #6883BA;
      margin-right: 3px;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes typing {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .professor-badge {
      display: inline-block;
      background: linear-gradient(135deg, #FF7E5F, #3D3B8E);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 5px;
      font-weight: bold;
    }

    .error-message {
      background: #ffe6e6;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .retry-btn {
      background: linear-gradient(135deg, #3D3B8E, #FF7E5F);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    /* Styles pour la structure académique */
    .academic-structure {
      margin: 10px 0;
    }

    .introduction {
      background: #f8f9fa;
      padding: 15px;
      border-left: 4px solid #3D3B8E;
      margin: 10px 0;
      font-weight: bold;
    }

    .conclusion {
      background: #f8f9fa;
      padding: 15px;
      border-left: 4px solid #FF7E5F;
      margin: 10px 0;
      font-weight: bold;
    }

    .main-point {
      margin: 15px 0;
    }

    .main-point-title {
      font-weight: bold;
      color: #3D3B8E;
      margin-bottom: 5px;
      font-size: 1.1em;
    }

    .sub-point {
      margin-left: 20px;
      margin-bottom: 8px;
    }

    .sub-point-title {
      font-weight: bold;
      color: #2c3e50;
    }

    .example {
      background: #e8f4fd;
      padding: 10px;
      border-radius: 5px;
      margin: 8px 0;
      font-style: italic;
      border-left: 3px solid #3498db;
    }

    .important-term {
      font-weight: bold;
      color: #3D3B8E;
    }

    .section-title {
      font-weight: bold;
      color: #3D3B8E;
      font-size: 1.1em;
      margin: 15px 0 8px 0;
      padding-bottom: 5px;
      border-bottom: 2px solid #f0f0f0;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
      
      .message {
        max-width: 90%;
      }
      
      .file-preview img {
        max-width: 120px;
      }
      
      .file-preview-container {
        max-width: 200px;
      }
      
      .chat-input-wrapper {
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <!-- Messages dynamiques -->
      <div class="message bot">
        <div class="bot-message-content">
          <strong>Bonjour ! 👋</strong> Je suis votre <span class="professor-badge">Professeur ClassePro</span>. Je suis là pour vous aider à réviser vos cours, comprendre vos leçons et progresser dans vos apprentissages. Quelle matière ou quel sujet souhaitez-vous travailler aujourd'hui ?
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-container">
    <div class="chat-input-wrapper">
      <div class="chat-input">
        <textarea id="messageInput" placeholder="Posez votre question ou demandez une explication..." rows="1"></textarea>
        <div class="chat-input-actions">
          <input type="file" id="fileInput" accept="image/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" hidden multiple>
          <button type="button" id="uploadBtn" title="Envoyer un fichier">📎</button>
          <button type="button" id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal pour la prévisualisation des images -->
  <div class="modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    // Configuration des clés API multiples
    const API_KEYS = [
      "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",
      "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",
      "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",
      "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",
      "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"
    ];
    
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    const MODEL = "meta-llama/llama-4-scout:free";

    // Gestionnaire de clés API
    let currentApiKeyIndex = 0;
    let apiErrorCount = 0;
    let lastApiCall = 0;
    const API_COOLDOWN = 2000; // 2 secondes entre les appels

    // Fonction pour obtenir la clé API actuelle
    function getCurrentApiKey() {
      return API_KEYS[currentApiKeyIndex];
    }

    // Fonction pour basculer vers la clé API suivante
    function rotateApiKey() {
      currentApiKeyIndex = (currentApiKeyIndex + 1) % API_KEYS.length;
      console.log(`Basculement vers la clé API index: ${currentApiKeyIndex}`);
      apiErrorCount = 0; // Réinitialiser le compteur d'erreurs après rotation
    }

    // Fonction pour vérifier si une erreur nécessite une rotation de clé
    function shouldRotateKey(error) {
      return error.message.includes('429') || error.message.includes('quota') || error.message.includes('limit');
    }

    // Éléments DOM
    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const sendBtn = document.getElementById("sendBtn");
    const imageModal = document.getElementById("imageModal");
    const modalContent = document.getElementById("modalContent");
    const modalClose = document.getElementById("modalClose");

    // Historique des messages avec prompt système intégré
    let messageHistory = [
      {
        role: "system",
        content: `Tu es "Professeur ClassePro", un assistant éducatif qui aide les élèves à réviser leurs cours et à comprendre leurs leçons. Tu expliques avec des mots simples et tu proposes des exercices interactifs.

TON IDENTITÉ:
Tu es "Professeur ClassePro", un enseignant patient, clair et structuré.
Tu as été conçu par l'équipe ClassePro pour aider les élèves.
Tu es spécialisé dans l'explication pédagogique et l'accompagnement scolaire.

MÉTHODE PÉDAGOGIQUE:
Tu présentes toujours les cours avec une organisation logique : introduction, développement structuré, exemples concrets, conclusion claire.
Tu n'utilises JAMAIS les symboles **, ###, ##, #, --, ou tout autre signe de mise en forme Markdown.
Tu utilises le gras HTML <strong> pour mettre en valeur les termes importants.
Tu écris toujours dans un français académique adapté aux élèves du collège ou du lycée.
Tu expliques avec des mots simples, puis tu approfondis avec des exemples.

DOMAINES DE COMPÉTENCE:
Explication de notions scolaires (mathématiques, français, sciences, histoire, etc.)
Rédaction d'exposés, de rédactions, de résumés
Explication de textes littéraires
Aide aux devoirs et préparation aux examens
Cours de philosophie, langues, et toutes matières académiques

STRUCTURE POUR LES EXPOSÉS:
1. Introduction : Présentation claire du sujet et enjeux principaux
2. Développement organisé en grandes parties (I, II, III...) avec sous-parties
3. Chaque argument illustré par des exemples concrets
4. Conclusion qui résume et ouvre sur une réflexion

RÈGLES STRICTES DE MISE EN FORME:
Tu ne dois JAMAIS utiliser **texte** pour le gras.
Tu ne dois JAMAIS utiliser ###, ##, # pour les titres.
Tu ne dois JAMAIS utiliser -- ou --- pour les séparateurs.
Tu utilises <strong>texte</strong> pour mettre en valeur les termes importants.
Tu structures ton texte avec des titres clairs sans symboles.
Tu utilises des paragraphes aérés et bien organisés.
Tu adaptes ton langage au niveau de l'élève.
Tu es patient et encourageant dans tes explications.
Tu utilises des exemples concrets et des analogies simples.

Pour structurer ton texte, utilise des formulations comme:
"Introduction:" plutôt que "# Introduction"
"Première partie:" plutôt que "## Première partie"
"Conclusion:" plutôt que "# Conclusion"

Maintenant, accueille l'élève comme le Professeur ClassePro.`
      },
      {
        role: "assistant",
        content: "Bonjour ! 👋 Je suis votre Professeur ClassePro. Je suis là pour vous aider à réviser vos cours, comprendre vos leçons et progresser dans vos apprentissages. Quelle matière ou quel sujet souhaitez-vous travailler aujourd'hui ?"
      }
    ];

    // Initialiser le scroll vers le bas
    scrollToBottom();

    // Gestion de l'envoi du message
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Gestion du bouton d'upload
    uploadBtn.addEventListener("click", () => fileInput.click());

    // Gestion de la sélection de fichiers
    fileInput.addEventListener("change", () => {
      const files = fileInput.files;
      if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          displayFile(files[i]);
        }
        fileInput.value = "";
      }
    });

    // Gestion de la fermeture du modal
    modalClose.addEventListener("click", () => {
      imageModal.style.display = "none";
    });

    // Fermer le modal en cliquant à l'extérieur
    imageModal.addEventListener("click", (e) => {
      if (e.target === imageModal) {
        imageModal.style.display = "none";
      }
    });

    // Fonction pour envoyer un message
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (message) {
        addMessage(message, "user");
        messageInput.value = "";
        resetTextareaHeight();

        // Ajouter le message à l'historique
        messageHistory.push({ role: "user", content: message });

        // Vérifier le cooldown de l'API
        const now = Date.now();
        if (now - lastApiCall < API_COOLDOWN) {
          const waitTime = API_COOLDOWN - (now - lastApiCall);
          await new Promise(resolve => setTimeout(resolve, waitTime));
        }

        // Afficher l'indicateur de frappe
        const typingIndicator = addTypingIndicator();

        try {
          // Appeler l'API avec streaming
          lastApiCall = Date.now();
          await callOpenRouterAPIStreaming(messageHistory, typingIndicator);
          apiErrorCount = 0; // Réinitialiser le compteur d'erreurs en cas de succès
        } catch (error) {
          console.error("Erreur:", error);
          apiErrorCount++;
          
          // Supprimer l'indicateur de frappe en cas d'erreur
          if (typingIndicator && typingIndicator.parentNode) {
            typingIndicator.parentNode.remove();
          }
          
          // Gestion des erreurs avec rotation automatique des clés
          if (shouldRotateKey(error)) {
            console.log("Rotation de clé API nécessaire...");
            rotateApiKey();
            
            // Réessayer automatiquement avec la nouvelle clé
            if (apiErrorCount <= API_KEYS.length * 2) { // Limiter les tentatives
              await retryWithNewKey(message, typingIndicator);
            } else {
              handleRateLimitError(message);
            }
          } else {
            handleGenericError(message);
          }
        }
      }
    }

    // Fonction pour réessayer avec une nouvelle clé API
    async function retryWithNewKey(originalMessage, typingIndicator) {
      console.log(`Nouvelle tentative avec la clé API index: ${currentApiKeyIndex}`);
      
      // Recréer l'indicateur de frappe si nécessaire
      let newTypingIndicator = typingIndicator;
      if (!newTypingIndicator || !newTypingIndicator.parentNode) {
        newTypingIndicator = addTypingIndicator();
      }
      
      try {
        lastApiCall = Date.now();
        await callOpenRouterAPIStreaming(messageHistory, newTypingIndicator);
        apiErrorCount = 0; // Réinitialiser le compteur d'erreurs en cas de succès
      } catch (error) {
        console.error("Erreur avec la nouvelle clé:", error);
        apiErrorCount++;
        
        // Supprimer l'indicateur de frappe
        if (newTypingIndicator && newTypingIndicator.parentNode) {
          newTypingIndicator.parentNode.remove();
        }
        
        // Si c'est encore une erreur de quota, basculer à nouveau
        if (shouldRotateKey(error) && apiErrorCount <= API_KEYS.length * 2) {
          rotateApiKey();
          await retryWithNewKey(originalMessage);
        } else {
          // Si toutes les clés ont échoué ou trop d'erreurs
          if (shouldRotateKey(error)) {
            handleRateLimitError(originalMessage);
          } else {
            handleGenericError(originalMessage);
          }
        }
      }
    }

    // Fonction pour gérer les limites de dépassement de quota
    function handleRateLimitError(originalMessage) {
      const errorMsg = document.createElement("div");
      errorMsg.classList.add("message", "bot");
      errorMsg.innerHTML = `
        <div class="bot-message-content">
          <div class="error-message">
            <strong>Limite d'utilisation atteinte</strong><br>
            Nous avons atteint la limite de requêtes pour le moment. 
            Voici une réponse générée localement :<br><br>
            <strong>En tant que Professeur ClassePro</strong>, je suis désolé mais le service est temporairement surchargé. 
            ${generateFallbackResponse(originalMessage)}
            <br><br>
            <button class="retry-btn" onclick="retryLastMessage()">Réessayer</button>
          </div>
        </div>
      `;
      chatMessages.appendChild(errorMsg);
      scrollToBottom();
    }

    // Fonction pour gérer les autres erreurs
    function handleGenericError(originalMessage) {
      const errorMsg = document.createElement("div");
      errorMsg.classList.add("message", "bot");
      errorMsg.innerHTML = `
        <div class="bot-message-content">
          <div class="error-message">
            <strong>Problème de connexion</strong><br>
            Impossible de contacter le service pour le moment. 
            Voici une réponse générée localement :<br><br>
            <strong>En tant que Professeur ClassePro</strong>, je rencontre des difficultés techniques. 
            ${generateFallbackResponse(originalMessage)}
            <br><br>
            <button class="retry-btn" onclick="retryLastMessage()">Réessayer</button>
          </div>
        </div>
      `;
      chatMessages.appendChild(errorMsg);
      scrollToBottom();
    }

    // Fonction pour regénérer une réponse de secours
    function generateFallbackResponse(message) {
      const lowerMessage = message.toLowerCase();
      
      if (lowerMessage.includes('bonjour') || lowerMessage.includes('salut') || lowerMessage.includes('hello')) {
        return "Je suis votre Professeur ClassePro, ravi de vous rencontrer ! Quelle matière ou quel sujet souhaitez-vous étudier aujourd'hui ?";
      }
      else if (lowerMessage.includes('qui es-tu') || lowerMessage.includes('présente') || lowerMessage.includes('tu es')) {
        return "Je suis le Professeur ClassePro, conçu par l'équipe ClassePro pour vous accompagner dans vos études. Mon rôle est de vous aider à comprendre les concepts difficiles, réviser vos cours et progresser dans votre parcours éducatif avec des explications claires et structurées.";
      }
      else if (lowerMessage.includes('math') || lowerMessage.includes('calcul')) {
        return "Pour les mathématiques, je peux vous aider à comprendre les concepts fondamentaux, résoudre des problèmes ou expliquer des méthodes de calcul. Pouvez-vous préciser le chapitre ou le type d'exercice qui vous pose problème ?";
      }
      else if (lowerMessage.includes('français') || lowerMessage.includes('francais') || lowerMessage.includes('grammaire') || lowerMessage.includes('orthographe')) {
        return "En français, je peux vous aider avec la grammaire, l'orthographe, la conjugaison, l'analyse de texte ou la rédaction. Quel aspect du français souhaitez-vous travailler ?";
      }
      else if (lowerMessage.includes('histoire') || lowerMessage.includes('géographie') || lowerMessage.includes('geographie')) {
        return "Pour l'histoire-géographie, je peux vous expliquer les périodes historiques, les événements importants ou les concepts géographiques. Quel sujet vous intéresse particulièrement ?";
      }
      else if (lowerMessage.includes('science') || lowerMessage.includes('physique') || lowerMessage.includes('chimie') || lowerMessage.includes('svt')) {
        return "En sciences, je peux vous aider à comprendre les phénomènes physiques, les réactions chimiques ou les concepts biologiques. De quel domaine scientifique avez-vous besoin ?";
      }
      else if (lowerMessage.includes('exposé') || lowerMessage.includes('rédaction') || lowerMessage.includes('dissertation')) {
        return "Je peux vous aider à structurer un exposé, une rédaction ou une dissertation. La structure académique comprend une introduction, un développement organisé et une conclusion. Sur quel sujet souhaitez-vous travailler ?";
      }
      else if (lowerMessage.includes('aide') || lowerMessage.includes('problème') || lowerMessage.includes('sujet') || lowerMessage.includes('exercice')) {
        return "En tant que Professeur ClassePro, je peux vous aider à expliquer des concepts difficiles, réviser vos leçons, préparer des examens ou résoudre des exercices. Pouvez-vous me préciser le sujet sur lequel vous avez besoin d'aide ?";
      }
      else {
        return "Je comprends que vous cherchez des informations sur : \"" + message + "\". En tant que Professeur ClassePro, je serais ravi de vous aider avec ce sujet une fois le service rétabli. En attendant, vous pouvez préciser votre demande ou me poser une question sur une matière spécifique.";
      }
    }

    // Fonction pour réessayer le dernier message
    window.retryLastMessage = function() {
      // Supprimer le message d'erreur
      const lastMessage = chatMessages.lastChild;
      if (lastMessage && lastMessage.querySelector('.error-message')) {
        lastMessage.remove();
      }
      
      // Réessayer d'envoyer le dernier message utilisateur
      const lastUserMessage = messageHistory[messageHistory.length - 1];
      if (lastUserMessage && lastUserMessage.role === 'user') {
        sendMessageToAPI(lastUserMessage.content);
      }
    };

    // Fonction pour envoyer un message à l'API (séparée pour la réutilisation)
    async function sendMessageToAPI(message) {
      const typingIndicator = addTypingIndicator();
      
      try {
        lastApiCall = Date.now();
        await callOpenRouterAPIStreaming(messageHistory, typingIndicator);
        apiErrorCount = 0;
      } catch (error) {
        console.error("Erreur lors de la nouvelle tentative:", error);
        if (typingIndicator && typingIndicator.parentNode) {
          typingIndicator.parentNode.remove();
        }
        
        if (shouldRotateKey(error)) {
          rotateApiKey();
          if (apiErrorCount <= API_KEYS.length * 2) {
            await retryWithNewKey(message);
          } else {
            handleRateLimitError(message);
          }
        } else {
          handleGenericError(message);
        }
      }
    }

    // Fonction pour appeler l'API OpenRouter avec streaming
    async function callOpenRouterAPIStreaming(history, typingIndicator) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${getCurrentApiKey()}`,
            "Content-Type": "application/json",
            "HTTP-Referer": window.location.origin,
            "X-Title": "Professeur ClassePro"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: history,
            stream: true
          })
        });

        if (!response.ok) {
          if (response.status === 429) {
            throw new Error('Erreur API: 429 - Trop de requêtes');
          }
          throw new Error(`Erreur API: ${response.status} ${response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let assistantMessage = "";

        // Remplacer l'indicateur de frappe par le message de l'assistant
        const botMessageElement = typingIndicator.parentNode;
        botMessageElement.innerHTML = '<div class="bot-message-content"></div>';
        const messageContent = botMessageElement.querySelector('.bot-message-content');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');

          // Traiter toutes les lignes complètes
          for (let i = 0; i < lines.length - 1; i++) {
            const line = lines[i].trim();
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const data = JSON.parse(line.slice(6));
                const token = data.choices[0]?.delta?.content;
                if (token) {
                  assistantMessage += token;
                  // Formater le texte avec la structure académique
                  messageContent.innerHTML = formatAcademicText(assistantMessage);
                  scrollToBottom();
                }
              } catch (e) {
                console.error("Erreur de parsing JSON:", e, "Ligne:", line);
              }
            }
          }

          // Garder la dernière ligne incomplète dans le buffer
          buffer = lines[lines.length - 1];
        }

        // Ajouter la réponse complète à l'historique
        messageHistory.push({ role: "assistant", content: assistantMessage });
      } catch (error) {
        console.error("Erreur lors de l'appel API:", error);
        throw error;
      }
    }

    // Fonction pour formater le texte avec une structure académique
    function formatAcademicText(text) {
      // Nettoyer le texte de tous les symboles Markdown
      let cleanedText = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')  // **gras** -> <strong>gras</strong>
        .replace(/\*(.*?)\*/g, '<strong>$1</strong>')       // *gras* -> <strong>gras</strong>
        .replace(/### (.*?)(\n|$)/g, '<div class="section-title">$1</div>')  // ### Titre
        .replace(/## (.*?)(\n|$)/g, '<div class="section-title">$1</div>')   // ## Titre
        .replace(/# (.*?)(\n|$)/g, '<div class="section-title">$1</div>')    // # Titre
        .replace(/---+/g, '')  // Supprimer les lignes de séparation
        .replace(/--/g, '')    // Supprimer les tirets doubles
        .replace(/\[(.*?)\]\((.*?)\)/g, '$1');  // [lien](url) -> lien
      
      // Séparer le texte en paragraphes
      const paragraphs = cleanedText.split('\n\n');
      
      let formattedHTML = '';
      
      paragraphs.forEach(paragraph => {
        const trimmed = paragraph.trim();
        if (trimmed.length === 0) return;
        
        // Détecter les titres de sections naturels (sans symboles)
        if (trimmed.match(/^(INTRODUCTION|Introduction|INTRODUCTION:|Introduction:|CONCLUSION|Conclusion|CONCLUSION:|Conclusion:|I\.|II\.|III\.|IV\.|V\.|1\.|2\.|3\.|4\.|5\.|•|Exemple|EXEMPLE)/i)) {
          if (trimmed.toLowerCase().includes('introduction')) {
            formattedHTML += `<div class="introduction">${trimmed}</div>`;
          } else if (trimmed.toLowerCase().includes('conclusion')) {
            formattedHTML += `<div class="conclusion">${trimmed}</div>`;
          } else if (trimmed.match(/^[IVX]+\./)) {
            formattedHTML += `<div class="main-point"><div class="main-point-title">${trimmed}</div></div>`;
          } else if (trimmed.match(/^[0-9]+\./)) {
            formattedHTML += `<div class="sub-point"><span class="sub-point-title">${trimmed}</span></div>`;
          } else if (trimmed.startsWith('•')) {
            formattedHTML += `<div class="sub-point">${trimmed}</div>`;
          } else if (trimmed.toLowerCase().includes('exemple')) {
            formattedHTML += `<div class="example">${trimmed}</div>`;
          } else {
            formattedHTML += `<p>${trimmed}</p>`;
          }
        } 
        // Détecter les exemples
        else if (trimmed.toLowerCase().includes('exemple') || trimmed.toLowerCase().includes('par exemple')) {
          formattedHTML += `<div class="example">${trimmed}</div>`;
        }
        // Détecter les titres naturels (sans symboles Markdown)
        else if (trimmed.endsWith(':') && trimmed.length < 50 && !trimmed.includes(' ')) {
          formattedHTML += `<div class="section-title">${trimmed}</div>`;
        }
        else {
          formattedHTML += `<p>${trimmed}</p>`;
        }
      });
      
      return formattedHTML;
    }

    // Fonction pour ajouter un indicateur de frappe
    function addTypingIndicator() {
      const msg = document.createElement("div");
      msg.classList.add("message", "bot");
      
      const content = document.createElement("div");
      content.classList.add("bot-message-content");
      
      const typingIndicator = document.createElement("span");
      typingIndicator.classList.add("typing-indicator");
      typingIndicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      
      content.appendChild(typingIndicator);
      msg.appendChild(content);
      chatMessages.appendChild(msg);
      scrollToBottom();
      
      return typingIndicator;
    }

    // Fonction pour ajuster automatiquement la hauteur du textarea
    messageInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    // Fonction pour réinitialiser la hauteur du textarea
    function resetTextareaHeight() {
      messageInput.style.height = "auto";
    }

    // Fonction pour afficher un fichier dans la conversation
    function displayFile(file) {
      const preview = document.createElement("div");
      preview.classList.add("message", "user", "file-preview");

      // Obtenir l'icône appropriée selon le type de fichier
      const fileIcon = getFileIcon(file.type);
      
      if (file.type.startsWith("image/")) {
        // Convertir l'image en base64
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgContainer = document.createElement("div");
          imgContainer.classList.add("file-preview-container");
          
          const img = document.createElement("img");
          img.src = e.target.result;
          img.style.cursor = "pointer";
          img.addEventListener("click", () => openImageModal(e.target.result));
          imgContainer.appendChild(img);
          
          const fileInfo = createFileInfo(file, fileIcon);
          imgContainer.appendChild(fileInfo);
          
          preview.appendChild(imgContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else if (file.type.startsWith("audio/")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = e.target.result;
          preview.appendChild(audio);
          
          const fileInfo = createFileInfo(file, fileIcon);
          preview.appendChild(fileInfo);
          
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else if (file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = function(e) {
          const pdfContainer = document.createElement("div");
          pdfContainer.classList.add("file-preview-container");
          
          const pdfIcon = document.createElement("div");
          pdfIcon.innerHTML = "📕";
          pdfIcon.style.fontSize = "48px";
          pdfIcon.style.textAlign = "center";
          pdfIcon.style.marginBottom = "10px";
          pdfContainer.appendChild(pdfIcon);
          
          const fileInfo = createFileInfo(file, fileIcon);
          fileInfo.style.textAlign = "center";
          pdfContainer.appendChild(fileInfo);
          
          // Ajouter un bouton pour visualiser le PDF
          const viewBtn = document.createElement("button");
          viewBtn.textContent = "Ouvrir le PDF";
          viewBtn.style.marginTop = "10px";
          viewBtn.style.padding = "5px 10px";
          viewBtn.style.border = "none";
          viewBtn.style.borderRadius = "5px";
          viewBtn.style.background = "linear-gradient(135deg, #3D3B8E, #FF7E5F)";
          viewBtn.style.color = "white";
          viewBtn.style.cursor = "pointer";
          viewBtn.addEventListener("click", () => window.open(e.target.result, "_blank"));
          pdfContainer.appendChild(viewBtn);
          
          preview.appendChild(pdfContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else {
        // Pour les autres types de fichiers (Word, Excel, etc.)
        const reader = new FileReader();
        reader.onload = function(e) {
          const fileContainer = document.createElement("div");
          fileContainer.classList.add("file-preview-container");
          
          const fileIconElement = document.createElement("div");
          fileIconElement.innerHTML = fileIcon;
          fileIconElement.style.fontSize = "48px";
          fileIconElement.style.textAlign = "center";
          fileIconElement.style.marginBottom = "10px";
          fileContainer.appendChild(fileIconElement);
          
          const fileInfo = createFileInfo(file, fileIcon);
          fileInfo.style.textAlign = "center";
          fileContainer.appendChild(fileInfo);
          
          // Ajouter un bouton pour télécharger le fichier
          const downloadBtn = document.createElement("button");
          downloadBtn.textContent = "Télécharger";
          downloadBtn.style.marginTop = "10px";
          downloadBtn.style.padding = "5px 10px";
          downloadBtn.style.border = "none";
          downloadBtn.style.borderRadius = "5px";
          downloadBtn.style.background = "linear-gradient(135deg, #3D3B8E, #FF7E5F)";
          downloadBtn.style.color = "white";
          downloadBtn.style.cursor = "pointer";
          downloadBtn.addEventListener("click", () => {
            const a = document.createElement("a");
            a.href = e.target.result;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
          fileContainer.appendChild(downloadBtn);
          
          preview.appendChild(fileContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      }
    }

    // Fonction pour créer l'information du fichier
    function createFileInfo(file, icon) {
      const fileInfo = document.createElement("div");
      fileInfo.classList.add("file-item");
      
      const iconSpan = document.createElement("span");
      iconSpan.classList.add("file-icon");
      iconSpan.textContent = icon;
      
      const nameSpan = document.createElement("span");
      nameSpan.classList.add("file-name");
      nameSpan.textContent = file.name;
      
      const sizeSpan = document.createElement("span");
      sizeSpan.classList.add("file-size");
      sizeSpan.textContent = formatFileSize(file.size);
      
      fileInfo.appendChild(iconSpan);
      fileInfo.appendChild(nameSpan);
      fileInfo.appendChild(sizeSpan);
      
      return fileInfo;
    }

    // Fonction pour obtenir l'icône appropriée selon le type de fichier
    function getFileIcon(fileType) {
      if (fileType.startsWith("image/")) return "🖼️";
      if (fileType.startsWith("audio/")) return "🎵";
      if (fileType === "application/pdf") return "📕";
      if (fileType.includes("word") || fileType === "application/msword" || fileType === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") return "📄";
      if (fileType.includes("excel") || fileType === "application/vnd.ms-excel" || fileType === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet") return "📊";
      if (fileType.includes("powerpoint") || fileType === "application/vnd.ms-powerpoint" || fileType === "application/vnd.openxmlformats-officedocument.presentationml.presentation") return "📑";
      if (fileType.includes("text/plain")) return "📝";
      return "📎";
    }

    // Fonction pour formater la taille du fichier
    function formatFileSize(bytes) {
      if (bytes === 0) return "0 Bytes";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    // Fonction pour ouvrir le modal d'image
    function openImageModal(imageUrl) {
      modalContent.innerHTML = "";
      const img = document.createElement("img");
      img.src = imageUrl;
      modalContent.appendChild(img);
      imageModal.style.display = "flex";
    }

    // Fonction pour ajouter un message texte
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      
      if (sender === "bot") {
        const content = document.createElement("div");
        content.classList.add("bot-message-content");
        // Utiliser innerHTML pour permettre le formatage académique
        content.innerHTML = formatAcademicText(text);
        msg.appendChild(content);
      } else {
        msg.textContent = text;
      }
      
      chatMessages.appendChild(msg);
      scrollToBottom();
    }

    // Fonction pour faire défiler vers le bas
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Initialisation au chargement de la page
    document.addEventListener('DOMContentLoaded', function() {
      console.log("Professeur ClassePro initialisé avec système de rotation de clés API");
    });
  </script>
