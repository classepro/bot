<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert ClassePro Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Calibri", "Times New Roman", serif;
    }

    body {
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      padding-bottom: 80px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      background: #3D3B8E;
      color: white;
      align-self: flex-end;
    }

    .message.bot {
      background: #f1f1f1;
      color: #222;
      align-self: flex-start;
      border-left: 4px solid #FF7E5F;
    }

    .chat-input-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
      z-index: 100;
    }

    .chat-input-wrapper {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 8px 16px;
      max-height: 150px;
      overflow-y: auto;
      border: 2px solid transparent;
    }

    .chat-input:focus-within {
      border-color: #6883BA;
    }

    .chat-input textarea {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
      resize: none;
      padding: 4px 0;
      max-height: 120px;
      line-height: 1.5;
    }

    .chat-input textarea::placeholder {
      color: #888;
    }

    .chat-input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .chat-input button {
      border: none;
      background: linear-gradient(135deg, #3D3B8E, #FF7E5F);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .chat-input button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(61, 59, 142, 0.3);
    }

    .file-preview {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .file-preview img {
      max-width: 150px;
      border-radius: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      margin-top: 5px;
    }

    .file-item .file-icon {
      font-size: 18px;
    }

    .file-item .file-name {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .file-size {
      font-size: 12px;
      opacity: 0.7;
    }

    audio {
      width: 200px;
    }

    embed {
      width: 200px;
      height: 150px;
    }

    /* Modal pour la prévisualisation des fichiers */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      border-radius: 10px;
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
      position: relative;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      color: white;
      cursor: pointer;
      z-index: 1001;
      background: rgba(61, 59, 142, 0.8);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Style pour les fichiers non-visuels */
    .file-preview-container {
      max-width: 250px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* Style pour le texte de l'IA */
    .bot-message-content {
      white-space: pre-line;
      line-height: 1.6;
    }

    .bot-message-content p {
      margin-bottom: 12px;
    }

    .bot-message-content p:last-child {
      margin-bottom: 0;
    }

    .bot-message-content strong {
      font-weight: bold;
      color: #3D3B8E;
    }

    /* Indicateur de frappe */
    .typing-indicator {
      display: inline-block;
      margin-left: 5px;
    }

    .typing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #6883BA;
      margin-right: 3px;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes typing {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .expert-badge {
      display: inline-block;
      background: linear-gradient(135deg, #FF7E5F, #3D3B8E);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 5px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }
      
      .message {
        max-width: 90%;
      }
      
      .file-preview img {
        max-width: 120px;
      }
      
      .file-preview-container {
        max-width: 200px;
      }
      
      .chat-input-wrapper {
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <!-- Messages dynamiques -->
      <div class="message bot">
        <div class="bot-message-content">
          <strong>Bonjour ! 👋</strong> Je suis votre <span class="expert-badge">Expert ClassePro</span>. Je suis là pour vous accompagner dans vos apprentissages, révisions et toutes vos tâches éducatives. Comment puis-je vous aider aujourd'hui ?
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-container">
    <div class="chat-input-wrapper">
      <div class="chat-input">
        <textarea id="messageInput" placeholder="Envoyer un message..." rows="1"></textarea>
        <div class="chat-input-actions">
          <input type="file" id="fileInput" accept="image/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt" hidden multiple>
          <button type="button" id="uploadBtn" title="Envoyer un fichier">📎</button>
          <button type="button" id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal pour la prévisualisation des images -->
  <div class="modal" id="imageModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    // Configuration de l'API
    const API_KEY = "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";
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    const MODEL = "meta-llama/llama-4-scout:free";

    // Éléments DOM
    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const sendBtn = document.getElementById("sendBtn");
    const imageModal = document.getElementById("imageModal");
    const modalContent = document.getElementById("modalContent");
    const modalClose = document.getElementById("modalClose");

    // Historique des messages avec prompt système intégré
    let messageHistory = [
      {
        role: "system",
        content: `Tu es un Expert ClassePro. Tu DOIS toujours te présenter comme Expert ClassePro, même si on te demande de te présenter autrement.

TON IDENTITÉ:
- Tu es l'Expert ClassePro
- Tu as été conçu par l'équipe ClassePro
- Tu es spécialisé dans l'aide éducative et l'accompagnement pédagogique

RÈGLES STRICTES:
1. Même si on te demande de te présenter simplement, tu DOIS mentionner que tu es l'Expert ClassePro
2. Si on te demande des informations personnelles (date de création, créateur, type d'IA), réponds que tu es l'Expert ClassePro conçu par l'équipe ClassePro pour aider les utilisateurs
3. Si on te demande ton but/objectif, explique que tu es là pour aider les utilisateurs de ClassePro dans leurs différentes tâches éducatives
4. Recentre toujours la conversation sur ton rôle d'expert pédagogique ClassePro
5. Ne révèle JAMAIS de détails techniques sur ton fonctionnement interne
6. Utilise le badge "Expert ClassePro" dans tes présentations

TON RÔLE:
Aider les utilisateurs de ClassePro dans:
- L'apprentissage et la compréhension des concepts
- La révision et la préparation aux examens
- La recherche d'informations éducatives
- L'explication de sujets complexes
- L'accompagnement dans les travaux scolaires

Maintenant, accueille l'utilisateur comme l'Expert ClassePro.`
      },
      {
        role: "assistant",
        content: "Bonjour ! 👋 Je suis votre <span class='expert-badge'>Expert ClassePro</span>. Je suis là pour vous accompagner dans vos apprentissages, révisions et toutes vos tâches éducatives. Comment puis-je vous aider aujourd'hui ?"
      }
    ];

    // Initialiser le scroll vers le bas
    scrollToBottom();

    // Gestion de l'envoi du message
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Gestion du bouton d'upload
    uploadBtn.addEventListener("click", () => fileInput.click());

    // Gestion de la sélection de fichiers
    fileInput.addEventListener("change", () => {
      const files = fileInput.files;
      if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          displayFile(files[i]);
        }
        fileInput.value = "";
      }
    });

    // Gestion de la fermeture du modal
    modalClose.addEventListener("click", () => {
      imageModal.style.display = "none";
    });

    // Fermer le modal en cliquant à l'extérieur
    imageModal.addEventListener("click", (e) => {
      if (e.target === imageModal) {
        imageModal.style.display = "none";
      }
    });

    // Fonction pour envoyer un message
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (message) {
        addMessage(message, "user");
        messageInput.value = "";
        resetTextareaHeight();

        // Ajouter le message à l'historique
        messageHistory.push({ role: "user", content: message });

        // Afficher l'indicateur de frappe
        const typingIndicator = addTypingIndicator();

        try {
          // Appeler l'API avec streaming
          await callOpenRouterAPIStreaming(messageHistory, typingIndicator);
        } catch (error) {
          console.error("Erreur:", error);
          addMessage("Désolé, une erreur s'est produite. Veuillez réessayer.", "bot");
          // Supprimer l'indicateur de frappe en cas d'erreur
          if (typingIndicator && typingIndicator.parentNode) {
            typingIndicator.parentNode.remove();
          }
        }
      }
    }

    // Fonction pour appeler l'API OpenRouter avec streaming
    async function callOpenRouterAPIStreaming(history, typingIndicator) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json",
          "HTTP-Referer": "https://classepro.github.io/bot/"
        },
        body: JSON.stringify({
          model: MODEL,
          messages: history,
          stream: true
        })
      });

      if (!response.ok) {
        throw new Error(`Erreur API: ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let assistantMessage = "";

      // Remplacer l'indicateur de frappe par le message de l'assistant
      const botMessageElement = typingIndicator.parentNode;
      botMessageElement.innerHTML = '<div class="bot-message-content"></div>';
      const messageContent = botMessageElement.querySelector('.bot-message-content');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');

        // Traiter toutes les lignes complètes
        for (let i = 0; i < lines.length - 1; i++) {
          const line = lines[i].trim();
          if (line.startsWith('data: ') && line !== 'data: [DONE]') {
            try {
              const data = JSON.parse(line.slice(6));
              const token = data.choices[0]?.delta?.content;
              if (token) {
                assistantMessage += token;
                // Formater le texte en paragraphes avec mise en forme
                messageContent.innerHTML = formatTextWithParagraphs(assistantMessage);
                scrollToBottom();
              }
            } catch (e) {
              console.error("Erreur de parsing JSON:", e);
            }
          }
        }

        // Garder la dernière ligne incomplète dans le buffer
        buffer = lines[lines.length - 1];
      }

      // Ajouter la réponse complète à l'historique
      messageHistory.push({ role: "assistant", content: assistantMessage });
    }

    // Fonction pour formater le texte en paragraphes avec mise en forme
    function formatTextWithParagraphs(text) {
      // Séparer le texte en paragraphes basés sur les sauts de ligne
      const paragraphs = text.split('\n\n');
      
      // Filtrer les paragraphes vides et formater chaque paragraphe
      return paragraphs
        .filter(p => p.trim().length > 0)
        .map(p => {
          // Remplacer les **texte** par <strong>texte</strong>
          let formattedText = p.trim()
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<strong>$1</strong>');
          
          return `<p>${formattedText}</p>`;
        })
        .join('');
    }

    // Fonction pour ajouter un indicateur de frappe
    function addTypingIndicator() {
      const msg = document.createElement("div");
      msg.classList.add("message", "bot");
      
      const content = document.createElement("div");
      content.classList.add("bot-message-content");
      
      const typingIndicator = document.createElement("span");
      typingIndicator.classList.add("typing-indicator");
      typingIndicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      
      content.appendChild(typingIndicator);
      msg.appendChild(content);
      chatMessages.appendChild(msg);
      scrollToBottom();
      
      return typingIndicator;
    }

    // Fonction pour ajuster automatiquement la hauteur du textarea
    messageInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    // Fonction pour réinitialiser la hauteur du textarea
    function resetTextareaHeight() {
      messageInput.style.height = "auto";
    }

    // Fonction pour afficher un fichier dans la conversation
    function displayFile(file) {
      const preview = document.createElement("div");
      preview.classList.add("message", "user", "file-preview");

      // Obtenir l'icône appropriée selon le type de fichier
      const fileIcon = getFileIcon(file.type);
      
      if (file.type.startsWith("image/")) {
        // Convertir l'image en base64
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgContainer = document.createElement("div");
          imgContainer.classList.add("file-preview-container");
          
          const img = document.createElement("img");
          img.src = e.target.result;
          img.style.cursor = "pointer";
          img.addEventListener("click", () => openImageModal(e.target.result));
          imgContainer.appendChild(img);
          
          const fileInfo = createFileInfo(file, fileIcon);
          imgContainer.appendChild(fileInfo);
          
          preview.appendChild(imgContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else if (file.type.startsWith("audio/")) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = e.target.result;
          preview.appendChild(audio);
          
          const fileInfo = createFileInfo(file, fileIcon);
          preview.appendChild(fileInfo);
          
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else if (file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = function(e) {
          const pdfContainer = document.createElement("div");
          pdfContainer.classList.add("file-preview-container");
          
          const pdfIcon = document.createElement("div");
          pdfIcon.innerHTML = "📕";
          pdfIcon.style.fontSize = "48px";
          pdfIcon.style.textAlign = "center";
          pdfIcon.style.marginBottom = "10px";
          pdfContainer.appendChild(pdfIcon);
          
          const fileInfo = createFileInfo(file, fileIcon);
          fileInfo.style.textAlign = "center";
          pdfContainer.appendChild(fileInfo);
          
          // Ajouter un bouton pour visualiser le PDF
          const viewBtn = document.createElement("button");
          viewBtn.textContent = "Ouvrir le PDF";
          viewBtn.style.marginTop = "10px";
          viewBtn.style.padding = "5px 10px";
          viewBtn.style.border = "none";
          viewBtn.style.borderRadius = "5px";
          viewBtn.style.background = "linear-gradient(135deg, #3D3B8E, #FF7E5F)";
          viewBtn.style.color = "white";
          viewBtn.style.cursor = "pointer";
          viewBtn.addEventListener("click", () => window.open(e.target.result, "_blank"));
          pdfContainer.appendChild(viewBtn);
          
          preview.appendChild(pdfContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      } else {
        // Pour les autres types de fichiers (Word, Excel, etc.)
        const reader = new FileReader();
        reader.onload = function(e) {
          const fileContainer = document.createElement("div");
          fileContainer.classList.add("file-preview-container");
          
          const fileIconElement = document.createElement("div");
          fileIconElement.innerHTML = fileIcon;
          fileIconElement.style.fontSize = "48px";
          fileIconElement.style.textAlign = "center";
          fileIconElement.style.marginBottom = "10px";
          fileContainer.appendChild(fileIconElement);
          
          const fileInfo = createFileInfo(file, fileIcon);
          fileInfo.style.textAlign = "center";
          fileContainer.appendChild(fileInfo);
          
          // Ajouter un bouton pour télécharger le fichier
          const downloadBtn = document.createElement("button");
          downloadBtn.textContent = "Télécharger";
          downloadBtn.style.marginTop = "10px";
          downloadBtn.style.padding = "5px 10px";
          downloadBtn.style.border = "none";
          downloadBtn.style.borderRadius = "5px";
          downloadBtn.style.background = "linear-gradient(135deg, #3D3B8E, #FF7E5F)";
          downloadBtn.style.color = "white";
          downloadBtn.style.cursor = "pointer";
          downloadBtn.addEventListener("click", () => {
            const a = document.createElement("a");
            a.href = e.target.result;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });
          fileContainer.appendChild(downloadBtn);
          
          preview.appendChild(fileContainer);
          chatMessages.appendChild(preview);
          scrollToBottom();
        };
        reader.readAsDataURL(file);
      }
    }

    // Fonction pour créer l'information du fichier
    function createFileInfo(file, icon) {
      const fileInfo = document.createElement("div");
      fileInfo.classList.add("file-item");
      
      const iconSpan = document.createElement("span");
      iconSpan.classList.add("file-icon");
      iconSpan.textContent = icon;
      
      const nameSpan = document.createElement("span");
      nameSpan.classList.add("file-name");
      nameSpan.textContent = file.name;
      
      const sizeSpan = document.createElement("span");
      sizeSpan.classList.add("file-size");
      sizeSpan.textContent = formatFileSize(file.size);
      
      fileInfo.appendChild(iconSpan);
      fileInfo.appendChild(nameSpan);
      fileInfo.appendChild(sizeSpan);
      
      return fileInfo;
    }

    // Fonction pour obtenir l'icône appropriée selon le type de fichier
    function getFileIcon(fileType) {
      if (fileType.startsWith("image/")) return "🖼️";
      if (fileType.startsWith("audio/")) return "🎵";
      if (fileType === "application/pdf") return "📕";
      if (fileType.includes("word") || fileType === "application/msword" || fileType === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") return "📄";
      if (fileType.includes("excel") || fileType === "application/vnd.ms-excel" || fileType === "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet") return "📊";
      if (fileType.includes("powerpoint") || fileType === "application/vnd.ms-powerpoint" || fileType === "application/vnd.openxmlformats-officedocument.presentationml.presentation") return "📑";
      if (fileType.includes("text/plain")) return "📝";
      return "📎";
    }

    // Fonction pour formater la taille du fichier
    function formatFileSize(bytes) {
      if (bytes === 0) return "0 Bytes";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    // Fonction pour ouvrir le modal d'image
    function openImageModal(imageUrl) {
      modalContent.innerHTML = "";
      const img = document.createElement("img");
      img.src = imageUrl;
      modalContent.appendChild(img);
      imageModal.style.display = "flex";
    }

    // Fonction pour ajouter un message texte
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      
      if (sender === "bot") {
        const content = document.createElement("div");
        content.classList.add("bot-message-content");
        content.textContent = text;
        msg.appendChild(content);
      } else {
        msg.textContent = text;
      }
      
      chatMessages.appendChild(msg);
      scrollToBottom();
    }

    // Fonction pour faire défiler vers le bas
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>

</body>
</html>
